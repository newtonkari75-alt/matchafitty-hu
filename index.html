<!DOCTYPE html>
<html lang="hu-HU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO BÁSICO - SEM RASTREADORES -->
    <title>Matcha Fitty - Természetes fogyás és anyagcsere-fokozás</title>
    <meta name="description" content="Matcha Fitty: A prémium japán matcha tea formula a gyorsabb anyagcseréért és a fenntartható fogyásért. -50% kedvezmény, ingyenes szállítás Magyarországon.">
    <meta name="keywords" content="Matcha Fitty, matcha tea fogyás, zsírégető tea, anyagcsere fokozás, természetes fogyókúra, Matcha Fitty ár, fogyás éhezés nélkül">
    
    <!-- Open Graph (Facebook/Instagram/WhatsApp) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Matcha Fitty - A legjobb megoldás a karcsú testért">
    <meta property="og:description" content="Fogyjon természetesen a Matcha Fitty-vel. Exkluzív 50%-os ajánlat Magyarországon.">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Matcha Fitty - Különleges Ajánlat">
    <meta name="twitter:description" content="Természetes zsírégetés és energia. Csak 11400 Ft ma!">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Fonte do sistema de alta qualidade */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            overflow: hidden;
        }

        .site-background {
            position: fixed;
            inset: 0;
            background-image: url('images/matchafitty-mob.png');
            background-size: cover;
            background-position: center;
            filter: brightness(0.65);
            z-index: 1;
        }

        @media (min-width: 1024px) {
            .site-background {
                background-image: url('images/matchafitty-desk.png');
            }
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .offer-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.7);
            
            /* Borda em Degradê Profissional */
            border: 4px solid transparent;
            background-image: linear-gradient(white, white), linear-gradient(135deg, #3E2208 0%, #CB741E 100%);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            
            animation: popIn 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.28);
            position: relative;
            z-index: 20;
            text-align: center;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .offer-header {
            background: linear-gradient(135deg, #3E2208 0%, #CB741E 100%);
            padding: 18px;
            color: white;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 13px;
            position: relative;
            margin: -1px; 
        }

        .price-container {
            padding: 25px 25px;
        }

        .old-price {
            font-size: 18px;
            color: #94a3b8;
            text-decoration: line-through;
            font-weight: 700;
            margin-bottom: -5px;
        }

        .new-price {
            font-size: 60px;
            font-weight: 900;
            color: #1a2b4e;
            line-height: 1;
            margin: 10px 0;
        }

        @media (min-width: 400px) {
            .new-price { font-size: 68px; }
        }

        .currency {
            font-size: 26px;
            vertical-align: middle;
            margin-left: 2px;
        }

        .discount-badge {
            background: #D91B21;
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 99px;
            font-weight: 900;
            font-size: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(217, 27, 33, 0.3);
            text-transform: uppercase;
        }

        .btn-cta {
            background: #00C853;
            color: white;
            display: block;
            margin: 0 20px 25px;
            padding: 20px;
            border-radius: 14px;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            box-shadow: 0 12px 24px -6px rgba(0, 200, 83, 0.5);
            transition: all 0.3s ease;
            animation: pulse 2.2s infinite;
        }

        .btn-cta:hover {
            background: #00a846;
            transform: translateY(-4px);
            box-shadow: 0 18px 30px -6px rgba(0, 200, 83, 0.6);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.7); }
            70% { box-shadow: 0 0 0 18px rgba(0, 200, 83, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 200, 83, 0); }
        }

        .limited-stock {
            font-size: 12px;
            text-transform: uppercase;
            color: #ef4444;
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            height: 10px;
            width: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="site-background"></div>

    <div class="overlay">
        
        <div class="offer-card">
            <!-- Título mais direto e profissional -->
            <header class="offer-header">
                Kizárólagos mai ajánlat Magyarországon
            </header>
            
            <div class="price-container">
                <div class="discount-badge">-50% KEDVEZMÉNY</div>
                
                <p class="old-price">22800 Ft helyett</p>
                
                <p class="new-price">
                    11400<span class="currency">Ft</span>
                </p>

                <div class="limited-stock">
                    <span class="dot"></span>
                    Már csak 7 csomag maradt az akciós készletből
                </div>

                <!-- Link limpo conforme solicitado -->
                <a href="https://tl-track.com/tracker/vXyN/" class="btn-cta">
                    IGÉNYLEM A KEDVEZMÉNYT
                </a>

                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest leading-relaxed">
                    Ingyenes Szállítás • Utánvét • Prémium Minőség
                </p>
            </div>

            <div class="bg-gray-50 p-5 border-t border-gray-100 flex justify-center gap-6">
                <img src="https://cdn-icons-png.flaticon.com/512/7518/7518063.png" alt="EU Tanúsítvány" class="h-7 opacity-60">
                <img src="https://cdn-icons-png.flaticon.com/512/2592/2592201.png" alt="Bio Matcha" class="h-7 opacity-60">
                <img src="https://cdn-icons-png.flaticon.com/512/10046/10046314.png" alt="Prémium Minőség" class="h-7 opacity-60">
            </div>
        </div>

    </div>

</body>
</html>
