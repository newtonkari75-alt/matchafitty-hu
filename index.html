<!DOCTYPE html>
<html lang="hu-HU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & Compliance -->
    <title>Matcha Fitty - Különleges Ajánlat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Evita scroll para parecer um popup fixo */
        }

        /* Fundo com a imagem oficial */
        .site-background {
            position: fixed;
            inset: 0;
            background-image: url('matchafitty-desk.png');
            background-size: cover;
            background-position: center;
            filter: brightness(0.7); /* Escurece um pouco para o popup brilhar */
            z-index: 1;
        }

        /* Overlay para foco no modal */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* O "Cookie" de Oferta / Card Central */
        .offer-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border: 4px solid #f39c12; /* Tom de laranja/dourado do site */
            animation: popIn 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.28);
            position: relative;
            z-index: 20;
            text-align: center;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .offer-header {
            background: linear-gradient(135deg, #f39c12 0%, #d35400 100%);
            padding: 15px;
            color: white;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }

        .price-container {
            padding: 30px 20px;
        }

        .old-price {
            font-size: 20px;
            color: #94a3b8;
            text-decoration: line-through;
            font-weight: 700;
        }

        .new-price {
            font-size: 64px;
            font-weight: 900;
            color: #1a2b4e;
            line-height: 1;
            margin: 10px 0;
        }

        .currency {
            font-size: 24px;
            vertical-align: middle;
        }

        .discount-badge {
            background: #D91B21;
            color: white;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 99px;
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 15px;
        }

        /* Botão Verde Vibrante (Congruência total) */
        .btn-cta {
            background: #00C853;
            color: white;
            display: block;
            margin: 0 20px 30px;
            padding: 20px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            box-shadow: 0 10px 20px -5px rgba(0, 200, 83, 0.5);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .btn-cta:hover {
            background: #00a846;
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(0, 200, 83, 0.6);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 200, 83, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 200, 83, 0); }
        }

        .limited-stock {
            font-size: 11px;
            text-transform: uppercase;
            color: #ef4444;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Fundo representando o site oficial -->
    <div class="site-background"></div>

    <!-- Camada de Overlay e Popup -->
    <div class="overlay">
        
        <div class="offer-card">
            <div class="offer-header">
                Exkluzív kedvezmény a mai napra
            </div>
            
            <div class="price-container">
                <div class="discount-badge">-50% KEDVEZMÉNY</div>
                
                <div class="old-price">22800 Ft helyett</div>
                
                <div class="new-price">
                    11400 <span class="currency">Ft</span>
                </div>

                <div class="limited-stock">
                    <span class="dot"></span>
                    Csak 7 darab maradt készleten
                </div>

                <a href="https://SUA-PAGINA-OFICIAL.com" class="btn-cta">
                    KÉREM AZ AJÁNLATOT
                </a>

                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">
                    Biztonságos fizetés és gyors kiszállítás
                </p>
            </div>

            <!-- Selos discretos no rodapé do card -->
            <div class="bg-gray-50 p-4 border-t border-gray-100 flex justify-center gap-4">
                <img src="https://cdn-icons-png.flaticon.com/512/7518/7518063.png" alt="EU" class="h-6 opacity-50">
                <img src="https://cdn-icons-png.flaticon.com/512/2592/2592201.png" alt="Bio" class="h-6 opacity-50">
                <img src="https://cdn-icons-png.flaticon.com/512/10046/10046314.png" alt="Natural" class="h-6 opacity-50">
            </div>
        </div>

    </div>

</body>
</html>
